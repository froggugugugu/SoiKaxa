[project]
name = "soikaxa"
version = "0.1.0"
description = "Standalone Raspberry Pi Bluetooth music player core"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "pillow>=10",
  "qrcode>=7.4",
]

[project.optional-dependencies]
pi = ["evdev>=1.7"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["soikaxa"]
