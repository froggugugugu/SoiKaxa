[project]
name = "soikaxa-workspace"
version = "0.2.0"
description = "SoiKaxa development workspace"
requires-python = ">=3.11"
dependencies = ["soikaxa", "soikaxa-adapter-ytmusic"]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["core", "adapters/soikaxa-adapter-ytmusic"]

[tool.uv.sources]
soikaxa = { workspace = true }
soikaxa-adapter-ytmusic = { workspace = true }

[dependency-groups]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "httpx>=0.27",
  "ruff>=0.6",
  "mypy>=1.11",
]

[tool.pytest.ini_options]
testpaths = ["tests", "adapters/soikaxa-adapter-ytmusic/tests"]
addopts = "-q"

[tool.coverage.run]
source = ["soikaxa", "soikaxa_adapter_ytmusic"]
omit = ["*/soikaxa/__main__.py"]

[tool.coverage.report]
exclude_also = ["if __name__ == .__main__.:", "pragma: no cover", "raise NotImplementedError", "\\.\\.\\."]

[tool.ruff]
line-length = 110
target-version = "py311"
extend-exclude = ["input", ".claude", ".agents", ".codex", "core/soikaxa/adapters/base.py", "core/soikaxa/adapters/local_mp3.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM"]
ignore = ["S101", "S603", "S607", "S311", "S104", "UP042"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S108", "B017"]
"adapters/*/tests/**" = ["S105", "S106", "S108"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = true
check_untyped_defs = true
